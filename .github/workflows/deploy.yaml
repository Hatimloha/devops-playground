name: frontend-deploy

on:
    workflow_run: 
        workflows: ["frontend-build"]
        types:
            - completed
        branches: 
            - main
jobs:
  container-deploy:
    runs-on: self-hosted

    steps:
      - name: Docker container check
        run: docker ps -a

      - name: Docker volume create
        run: docker volume create myvol

      - name: Docker network create
        run: docker network create mynet

      - name: Docker existing container remove
        run: docker rm -f frontend

      - name: Docker container create and run
        run: |
          docker run -d --name frontend \
            -p 3000:3000 \
            -v $(pwd):/app \
            --network=mynet \
            hatimlohawala/frontend:v1