name: frontend-ci-cd

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  container-deploy:
    runs-on: self-hosted
    needs: docker-image

    steps:
      - name: Docker container check
        run: docker ps -a

      - name: Docker volume create
        run: docker volume create myvol

      - name: Docker network create
        run: docker network create mynet

      - name: Docker container create and run
        run: |
          docker run -d --name fronted \
            -p 3000:3000 \
            -v $(pwd):/app \
            --network=mynet \
            hatimlohawala/frontend:v1