name: frontend-ci-cd

on:
    push: 
        branches: 
            - main

    pull_request: 

jobs:
    docker-image:
        runs-on:
            - self-hosted

        steps:
            - name: repo fetch
              uses: actions/checkout@v4

            - name: delete existing docker images
              run: docker rmi -f hatimlohawala/frontend:v1

            - name: docker build
              run: docker build -t hatimlohawala/frontend:v1 .

            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }} # token
                
              
            - name: docker push
              run: docker push hatimlohawala/frontend:v1