name: frontend-build

on:
    push: 
        branches: 
            - main

    pull_request: 

jobs:
    docker-image:
        runs-on:
            - self-hosted

        steps:
            - name: repo fetch
              uses: actions/checkout@v4

            - name: docker build
              run: docker build -t hatimlohawala/frontend:v1 .

            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USER }}
                password: ${{ secrets.DOCKER_TOKEN }}
              
            - name: docker push
              run: docker push hatimlohawala/frontend:v1