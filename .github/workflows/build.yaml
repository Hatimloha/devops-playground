name: frontend-cicd

on:
    push: 
        branches: 
            - main

    pull_request: 

jobs:
    docker-image:
        runs-on:
            - self-hosted

        steps:
            - name: repo fetch
              uses: actions/checkout@v4

            - name: delete existing docker images
              run: docker rmi -f hatimlohawala/frontend:v1

            - name: docker build
              run: docker build -t hatimlohawala/frontend:v1 .

            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }} # token
                
              
            - name: docker push
              run: docker push hatimlohawala/frontend:v1

    container-deploy:
        runs-on: self-hosted
        needs: docker-image

        steps:
          - name: Docker container check
            run: docker ps -a

          - name: Docker existing container remove
            run: docker rm -f frontend 2>/dev/null || true

          - name: Docker volume delete & create
            run: |
                docker volume rm -f myvol 2>/dev/null || true
                docker volume create myvol

          - name: Docker network delete & create
            run: |
                docker network rm -f mynet 2>/dev/null || true
                docker network create mynet


          - name: Docker container create and run
            run: |
              docker run -d --name frontend \
                -p 80:80 \
                -v myvol:/app \
                --network=mynet \
                hatimlohawala/frontend:v1

          - name: Docker container check
            run: docker ps -a

          - name: compute check 
            run: docker top frontend